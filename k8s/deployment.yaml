apiVersion: apps/v1
kind: Deployment
metadata:
  name: airwatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airwatch
  template:
    metadata:
      labels:
        app: airwatch
    spec:
      containers:
        - name: airwatch
          image: sumayyasadaf/airwatch:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000